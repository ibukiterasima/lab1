<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かぞくの窓(試作品)</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F4EC;--beige:#D9C9B5;--green:#91A88B;--text:#665747;--white:#fffdf8}
html{font-size:24px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:500 1rem/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif}
#app{max-width:720px;margin:0 auto;min-height:100%;padding:16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:8px 0}h2{font-size:1.2rem;margin:0}
input,select{width:100%;font:inherit;font-size:1.1rem;padding:14px;border:3px solid var(--beige);border-radius:14px;background:var(--white);color:var(--text)}
label{display:block;font-weight:700;margin:12px 0 4px}
button{font:700 22px inherit;font-family:inherit;min-height:3rem;padding:12px 20px;border:0;border-radius:16px;background:var(--green);color:#fff;cursor:pointer}
button.sub{background:var(--beige);color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--text);outline-offset:2px}
.card{background:var(--white);border:3px solid var(--beige);border-radius:20px;padding:20px}
.clock{text-align:center}.clock .t{font-size:min(3.6rem,17vw);font-weight:700;line-height:1.1}.clock .d{font-size:1.3rem}
.big{display:grid;gap:12px}.big button{width:100%;font-size:1.3rem;min-height:3.8rem}
.err{color:#a3401f;font-weight:700;min-height:1.6em}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px;max-height:60vh}
.m{max-width:85%;padding:10px 14px;border-radius:18px;background:var(--white);border:2px solid var(--beige)}
.m.me{align-self:flex-end;background:var(--green);color:#fff;border-color:var(--green)}
.m .who{font-size:.9rem;opacity:.85}.m .tm{font-size:.8rem;opacity:.75;text-align:right}
.m .b{font-size:1.2rem;white-space:pre-wrap;word-break:break-word}
.send{display:flex;gap:8px}.send input{flex:1}
.code{font-size:1.7rem;letter-spacing:.2em;font-weight:700}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.97)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid button{padding:0;min-height:0;background:none;border-radius:14px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:3px solid var(--beige);display:block}
.photo{width:100%;border-radius:16px;border:3px solid var(--beige);display:block}
svg.ic{width:1.1em;height:1.1em;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:.2em}
.av{width:1.4em;height:1.4em;border-radius:50%;object-fit:cover;vertical-align:-.3em;margin-right:.2em;border:2px solid var(--beige)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{min-height:2.8rem;padding:4px;font-size:.9rem;background:var(--white);color:var(--text);border:2px solid var(--beige);border-radius:10px}
.cal .today{border:4px solid var(--green)}.cal .sel{background:var(--green);color:#fff}
.cal .dot{display:block;height:8px;width:8px;border-radius:50%;background:var(--green);margin:2px auto 0}.cal .sel .dot{background:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1;min-height:2.6rem;font-size:1rem}
.ev{width:100%;text-align:left;margin-top:8px;font-size:1.1rem;font-weight:500}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.icg button{min-height:3.6rem;font-size:2rem;background:var(--white);color:var(--text);border:3px solid var(--beige);padding:0}
.icg .on{border-color:var(--green);background:#e8efe6}
small{font-size:.85em}
.tabs .on{background:var(--green);color:#fff}
button.danger,.danger{background:#b5593a;color:#fff}
.ov{position:fixed;inset:0;z-index:10;background:rgba(102,87,71,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:560px;width:100%}
.cimg{max-width:100%;max-height:50vh;border-radius:12px;display:block;margin-top:6px;cursor:pointer}
.ov{overflow-y:auto}.ov img{max-width:100%;max-height:55vh;display:block;margin:0 auto 12px;border-radius:12px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(
  "https://onzezcpkdfynssnhmzbl.supabase.co",
  "sb_publishable_4PK7Wkl8JrFrOelSnMbAmw_2-M5IQk2");
const $app = document.getElementById("app");
const FS = { "ふつう": 24, "大きい": 28, "とても大きい": 32 };
let curFs = 24; try { curFs = +localStorage.getItem("fs") || 24; } catch (e) {}
document.documentElement.style.fontSize = curFs + "px";
const SVG = {"home": "<path d=\"M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6\"/>", "chat": "<path d=\"M4 5h16v11H9l-5 4z\"/>", "camera": "<path d=\"M3 8h4l2-3h6l2 3h4v12H3z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3\"/><path d=\"M3 20c0-3.5 3-6 6-6s6 2.5 6 6\"/><circle cx=\"17\" cy=\"9\" r=\"2.5\"/><path d=\"M16 14c3 0 5 2 5 5\"/>", "trash": "<path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"/>", "back": "<path d=\"M15 5l-7 7 7 7\"/>", "star": "<path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z\"/>", "heart": "<path d=\"M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z\"/>", "sun": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"/>", "leaf": "<path d=\"M5 19C5 10 10 5 20 4c0 10-5 15-14 15zM5 19l8-8\"/>", "flower": "<circle cx=\"12\" cy=\"12\" r=\"2.5\"/><circle cx=\"12\" cy=\"6.5\" r=\"3\"/><circle cx=\"12\" cy=\"17.5\" r=\"3\"/><circle cx=\"6.5\" cy=\"12\" r=\"3\"/><circle cx=\"17.5\" cy=\"12\" r=\"3\"/>", "moon": "<path d=\"M20 14A8 8 0 1110 4a6.5 6.5 0 0010 10z\"/>", "cloud": "<path d=\"M7 18a4 4 0 010-8 5.5 5.5 0 0110.5 1.5A3.3 3.3 0 0117 18z\"/>", "apple": "<path d=\"M12 8c-3-2-7 0-7 5s3 8 7 7c4 1 7-2 7-7s-4-7-7-5zM12 8c0-2 1-4 3-4\"/>", "smile": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 14c1 2 3 3 4 3s3-1 4-3M9 10h.01M15 10h.01\"/>"};
Object.assign(SVG, {
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', forward: '<path d="M9 5l7 7-7 7"/>' });
let avUrl = {};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${SVG[n] || SVG.smile}</svg>`;
const av = n => {
  if (n && n.startsWith("photo:")) { const u = avUrl[n.slice(6)]; return u ? `<img class="av" src="${esc(u)}" alt="">` : ic("smile"); }
  return ic(SVG[n] ? n : "smile");
};
const ICONS = ["flower","leaf","star","heart","sun","moon","cloud","apple","smile"];
let me, fam, members = {}, chan, tick;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jmsg = e => (e && e.message || "うまくいきませんでした").replace(/Invalid login credentials/,"メールアドレスかパスワードが違います").replace(/User already registered/,"このメールアドレスは登録済みです").replace(/Password should be at least.*/,"パスワードは6文字以上にしてください");
const set = h => { onLive = null; clearInterval(tick); if (chan) { sb.removeChannel(chan); chan = null; } $app.innerHTML = h; };
const $ = s => $app.querySelector(s);

// 試作品用:メールアドレスだけでログイン(メール送信・確認なし)。本番では使わないこと。
const pwOf = e => "kzm-" + e.toLowerCase() + "-proto";
function authView() {
  set(`<h1>${ic("home")} かぞくの窓</h1><div class="card">
    <h2>メールアドレスを入れてください</h2>
    <label>メールアドレス</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="例:taro@example.com">
    <p class="err" id="err"></p>
    <div class="big"><button id="go">はじめる</button></div></div>`);
  const go = async () => {
    const email = $("#em").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return $("#err").textContent = "メールアドレスの形で入れてください";
    $("#go").disabled = true;
    const password = pwOf(email);
    let r = await sb.auth.signInWithPassword({ email, password });
    if (r.error) r = await sb.auth.signUp({ email, password });
    $("#go").disabled = false;
    if (r.error) return $("#err").textContent = jmsg(r.error);
    if (!r.data.session) return $("#err").textContent = "登録できませんでした。管理画面で「Confirm email」をオフにしてください。";
    start();
  };
  $("#go").onclick = go;
  $("#em").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) go(); };
}

async function start() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return authView();
  me = user;
  const { data } = await sb.from("members").select("family_id, display_name, icon, families(name)").eq("user_id", me.id).limit(1);
  if (!data || !data.length) return familyView();
  fam = { id: data[0].family_id, name: data[0].families.name, my: data[0] };
  const { data: ms } = await sb.from("members").select("user_id, display_name, icon").eq("family_id", fam.id);
  members = Object.fromEntries((ms || []).map(m => [m.user_id, m]));
  fam.my = members[me.id] || fam.my;
  const ph = [...new Set(Object.values(members).map(m => m.icon).filter(i => i && i.startsWith("photo:")).map(i => i.slice(6)))];
  avUrl = {};
  if (ph.length) { const { data: u } = await sb.storage.from("photos").createSignedUrls(ph, 3600); (u || []).forEach(x => avUrl[x.path] = x.signedUrl); }
  startLive();
  homeView();
}

async function ensure() {
  if (me) return;
  const { data, error } = await sb.auth.signInAnonymously();
  if (error) throw error;
  me = data.user;
}
function familyView() {
  set(`<h1>${ic("home")} かぞくの窓</h1><div class="card">
    <label>あなたのお名前(家族に表示されます)</label><input id="nm" placeholder="例:おばあちゃん">
    <label>家族の名前(作る場合)</label><input id="fn" placeholder="例:山田家">
    <label>招待コード(参加する場合)</label><input id="cd" placeholder="6文字のコード" autocapitalize="characters">
    <p class="err" id="err"></p>
    <div class="big"><button id="mk">新しく作る</button><button class="sub" id="jn">コードで参加する</button>
    ${me ? '<button class="sub" id="lo">ログアウト</button>' : ""}</div></div>`);
  const icon = () => ICONS[Math.floor(Math.random() * ICONS.length)];
  $("#mk").onclick = async () => {
    const nm = $("#nm").value.trim(), fn = $("#fn").value.trim();
    if (!nm || !fn) return $("#err").textContent = "お名前と家族の名前を入れてください";
    let error; try { await ensure(); ({ error } = await sb.rpc("create_family", { fname: fn, my_name: nm, my_icon: icon() })); } catch (e) { error = e; }
    error ? $("#err").textContent = jmsg(error) : start();
  };
  $("#jn").onclick = async () => {
    const nm = $("#nm").value.trim(), cd = $("#cd").value.trim();
    if (!nm || !cd) return $("#err").textContent = "お名前と招待コードを入れてください";
    let error; try { await ensure(); ({ error } = await sb.rpc("join_family", { code: cd, my_name: nm, my_icon: icon() })); } catch (e) { error = e; }
    error ? $("#err").textContent = jmsg(error) : start();
  };
  $("#lo") && ($("#lo").onclick = async () => { killLive(); await sb.auth.signOut(); me = null; authView(); });
}

function homeView() {
  set(`<div class="row"><h2>${av(fam.my.icon)} ${esc(fam.my.display_name)}さん</h2><span>${esc(fam.name)}</span></div>
    <div class="card clock"><div class="t" id="tm"></div><div class="d" id="dt"></div></div>
    <div class="card"><h2>${ic("calendar")} 今日の予定</h2><div id="today">読み込み中…</div></div>
    <div class="card"><h2>${ic("chat")} いちばん新しいメッセージ</h2><div id="last">読み込み中…</div></div>
    <div class="big"><button id="chat">${ic("chat")} 家族とおしゃべり</button>
    <button id="ph">${ic("camera")} 家族の写真</button>
    <button id="cl">${ic("calendar")} 家族の予定</button>
    <button class="sub" id="st">${ic("sliders")} 設定</button>
    <button class="sub" id="inv">${ic("users")} 家族を招待する</button>
    <button class="sub" id="lo">ログアウト</button></div><div id="invbox"></div>`);
  const draw = () => {
    const n = new Date();
    $("#tm").textContent = n.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    $("#dt").textContent = n.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  };
  draw(); tick = setInterval(draw, 1000);
  sb.from("messages").select("*").eq("family_id", fam.id).order("created_at", { ascending: false }).limit(1).then(({ data }) => {
    const m = data && data[0];
    $("#last").innerHTML = m ? `<b>${esc((members[m.user_id] || {}).display_name)}</b>:${esc(m.body || "写真を送りました")}` : "まだメッセージはありません。最初の一言を送ってみましょう。";
  });
  $("#chat").onclick = chatView;
  $("#ph").onclick = photoView;
  $("#cl").onclick = () => calView(); $("#st").onclick = settingsView;
  onLive = t => { if (t === "members") homeView(); else if (t === "events") paintToday(); else if (t === "messages") paintLast(); };
  { const t = new Date(), a = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    evq(a, addDays(a, 1)).then(({ data }) => { $("#today").innerHTML = (data && data.length) ? data.map(e => `<div><b>${hm(e.starts_at)}</b> ${esc(e.title)} <small>(${esc(who(e))})</small></div>`).join("") : "今日の予定はありません。"; }); }
  $("#lo").onclick = async () => { killLive(); await sb.auth.signOut(); me = null; authView(); };
  $("#inv").onclick = async () => {
    const { data } = await sb.rpc("my_invite_code", { fid: fam.id });
    $("#invbox").innerHTML = `<div class="card" style="text-align:center">家族にこのコードを伝えてください<div class="code">${esc(data)}</div></div>`;
  };
}

async function chatView() {
  set(`<div class="row"><button class="sub" id="bk">${ic("back")} もどる</button><h2>家族のチャット</h2></div>
    <div class="card" style="padding:12px"><div id="log"></div></div>
    <div class="send"><input id="ci" type="file" accept="image/*" class="hide"><button class="sub" id="cb" aria-label="写真を送る">${ic("camera")}</button><input id="tx" placeholder="メッセージを入力" autocomplete="off"><button id="sd">送る</button></div><p class="err" id="err"></p>`);
  const log = $("#log");
  const add = m => {
    const mine = m.user_id === me.id, u = members[m.user_id] || { display_name: "家族", icon: "smile" };
    const t = new Date(m.created_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    log.insertAdjacentHTML("beforeend", `<div class="m ${mine ? "me" : ""}"><div class="who">${av(u.icon)} ${esc(u.display_name)}</div><div class="b">${m.body ? esc(m.body) : ""}${m.photo_path ? `<img class="cimg" data-p="${esc(m.photo_path)}" alt="送られた写真(押すと大きく見られます)">` : ""}</div><div class="tm">${t}</div></div>`);
    if (m.photo_path) { const im = log.lastElementChild.querySelector(".cimg"); signed(m.photo_path).then(u => { im.src = u; log.scrollTop = log.scrollHeight; }); }
    log.scrollTop = log.scrollHeight;
  };
  const { data } = await sb.from("messages").select("*").eq("family_id", fam.id).order("created_at", { ascending: false }).limit(50);
  (data || []).reverse().forEach(add);
  chan = sb.channel("chat-" + fam.id).on("postgres_changes",
    { event: "INSERT", schema: "public", table: "messages", filter: "family_id=eq." + fam.id }, p => add(p.new)).subscribe();
  const send = async () => {
    const body = $("#tx").value.trim(); if (!body) return;
    $("#tx").value = "";
    const { error } = await sb.from("messages").insert({ family_id: fam.id, user_id: me.id, body });
    if (error) { $("#err").textContent = "送れませんでした。もう一度お試しください。"; $("#tx").value = body; }
  };
  $("#sd").onclick = send;
  log.onclick = e => { const im = e.target.closest(".cimg"); if (im && im.src) viewImage(im.dataset.p, im.src); };
  $("#cb").onclick = () => $("#ci").click();
  $("#ci").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    $("#err").textContent = "写真を送っています…";
    try {
      const blob = await shrink(f), path = `${fam.id}/chat-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const u = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" }); if (u.error) throw u.error;
      const r = await sb.from("messages").insert({ family_id: fam.id, user_id: me.id, photo_path: path }); if (r.error) throw r.error;
      $("#err").textContent = "";
    } catch (x) { $("#err").textContent = "写真を送れませんでした。"; }
    e.target.value = "";
  };
  $("#tx").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) send(); };
  $("#bk").onclick = start;
}

const fmt = t => new Date(t).toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
async function shrink(file, max = 1280) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.8));
}
async function photoView() {
  set(`<div class="row"><button class="sub" id="bk">${ic("back")} もどる</button><h2>家族の写真</h2></div>
    <input id="fi" type="file" accept="image/*" multiple class="hide">
    <button id="up">${ic("camera")} 写真をのせる</button><p class="err" id="err"></p><div class="grid" id="gr">読み込み中…</div>`);
  $("#bk").onclick = start;
  $("#up").onclick = () => $("#fi").click();
  $("#fi").onchange = async e => {
    const files = [...e.target.files]; let i = 0;
    for (const f of files) {
      $("#err").textContent = `送っています…(${++i}/${files.length})`;
      try {
        const blob = await shrink(f);
        const path = `${fam.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
        const u = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
        if (u.error) throw u.error;
        const r = await sb.from("photos").insert({ family_id: fam.id, user_id: me.id, path });
        if (r.error) throw r.error;
      } catch (x) { $("#err").textContent = "のせられない写真がありました。"; return photoView(); }
    }
    photoView();
  };
  onLive = t => { if (t === "photos" || t === "members") photoView(); };
  const { data } = await sb.from("photos").select("*").eq("family_id", fam.id).order("created_at", { ascending: false }).limit(60);
  const gr = $("#gr");
  if (!data || !data.length) return gr.textContent = "まだ写真がありません。最初の1枚をのせてみましょう。";
  const { data: urls } = await sb.storage.from("photos").createSignedUrls(data.map(p => p.path), 3600);
  const um = Object.fromEntries((urls || []).map(x => [x.path, x.signedUrl]));
  gr.innerHTML = data.map((p, i) => `<button data-i="${i}" aria-label="写真を大きく見る"><img src="${esc(um[p.path])}" alt="家族の写真" loading="lazy"></button>`).join("");
  gr.onclick = e => { const b = e.target.closest("button"); if (b) photoDetail(data[b.dataset.i], um[data[b.dataset.i].path]); };
}
async function photoDetail(p, url) {
  const u = members[p.user_id] || { display_name: "家族", icon: "smile" };
  set(`<div class="row"><button class="sub" id="bk">${ic("back")} もどる</button>${p.user_id === me.id ? '<button class="sub" id="rm">' + ic("trash") + ' けす</button>' : ""}</div>
    <img class="photo" src="${esc(url)}" alt="家族の写真">
    <div>${av(u.icon)} <b>${esc(u.display_name)}</b>さん ・ ${fmt(p.created_at)}</div>
    <button class="sub" id="dl">${ic("download")} スマホに保存</button>
    <div class="card"><h2>${ic("chat")} コメント</h2><div id="cm">読み込み中…</div></div>
    <div class="send"><input id="tx" placeholder="コメントを入力" autocomplete="off"><button id="sd">送る</button></div><p class="err" id="err"></p>`);
  $("#bk").onclick = photoView;
  $("#dl").onclick = () => saveToPhone(url);
  onLive = (t, pl) => { if (t === "photo_comments" || t === "members") draw(); else if (t === "photos" && pl.eventType === "DELETE" && pl.old.id === p.id) photoView(); };
  if ($("#rm")) $("#rm").onclick = async () => {
    if (!await ask("この写真をけしますか?", "けす")) return;
    await sb.from("photos").delete().eq("id", p.id);
    await sb.storage.from("photos").remove([p.path]);
    photoView();
  };
  const draw = async () => {
    const { data } = await sb.from("photo_comments").select("*").eq("photo_id", p.id).order("created_at");
    $("#cm").innerHTML = (data && data.length) ? data.map(c => { const w = members[c.user_id] || { display_name: "家族", icon: "smile" };
      return `<p style="margin:8px 0"><b>${av(w.icon)} ${esc(w.display_name)}</b>:${esc(c.body)}<br><small>${fmt(c.created_at)}</small></p>`; }).join("") : "まだコメントはありません。";
  };
  draw();
  const send = async () => {
    const body = $("#tx").value.trim(); if (!body) return;
    const { error } = await sb.from("photo_comments").insert({ photo_id: p.id, family_id: fam.id, user_id: me.id, body });
    if (error) return $("#err").textContent = "送れませんでした。もう一度お試しください。";
    $("#tx").value = ""; draw();
  };
  $("#sd").onclick = send;
  $("#tx").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) send(); };
}

const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hm = t => new Date(t).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
const evq = (a, b) => sb.from("events").select("*").eq("family_id", fam.id).gte("starts_at", a.toISOString()).lt("starts_at", b.toISOString()).order("starts_at");
const who = e => e.for_member ? ((members[e.for_member] || {}).display_name || "家族") : "みんな";

async function calView(cur = new Date(), rng = null) {
  const y = cur.getFullYear(), m = cur.getMonth(), now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  rng = rng || { a: t0, b: addDays(t0, 1), label: "今日" };
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  set(`<div class="row"><button class="sub" id="bk">${ic("back")} もどる</button><h2>家族の予定</h2></div>
    <div class="row"><button class="sub" id="pv" aria-label="前の月">${ic("back")}</button><h2>${y}年${m + 1}月</h2><button class="sub" id="nx" aria-label="次の月">${ic("forward")}</button></div>
    <div class="cal" id="cal"></div>
    <div class="tabs"><button class="sub" data-r="0">今日</button><button class="sub" data-r="1">明日</button><button class="sub" data-r="7">今週</button></div>
    <div class="card"><h2>${esc(rng.label)}の予定</h2><div id="ls">読み込み中…</div></div>
    <button id="ad">${ic("plus")} 予定を入れる</button>`);
  $("#bk").onclick = start;
  onLive = t => { if (t === "events" || t === "members") calView(cur, rng); };
  $("#pv").onclick = () => calView(new Date(y, m - 1, 1));
  $("#nx").onclick = () => calView(new Date(y, m + 1, 1));
  $("#ad").onclick = () => eventForm(null, ymd(rng.a));
  $app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    const n = +b.dataset.r, a = addDays(t0, n === 1 ? 1 : 0);
    calView(cur, { a, b: addDays(t0, n === 7 ? 7 : n + 1), label: ["今日", "明日", "今週"][n === 0 ? 0 : n === 1 ? 1 : 2] });
  });
  const cnt = {};
  const mq = await evq(first, new Date(y, m + 1, 1));
  (mq.data || []).forEach(e => { const k = ymd(new Date(e.starts_at)); cnt[k] = (cnt[k] || 0) + 1; });
  let h = ["日", "月", "火", "水", "木", "金", "土"].map(w => `<div><b>${w}</b></div>`).join("") + "<div></div>".repeat(first.getDay());
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), k = ymd(dt);
    h += `<button data-d="${k}" class="${k === ymd(t0) ? "today" : ""} ${k === ymd(rng.a) && rng.b - rng.a === 864e5 ? "sel" : ""}">${d}<span class="dot" style="visibility:${cnt[k] ? "visible" : "hidden"}"></span></button>`;
  }
  $("#cal").innerHTML = h;
  $("#cal").onclick = e => { const b = e.target.closest("button"); if (!b) return; const [yy, mm, dd] = b.dataset.d.split("-").map(Number);
    const a = new Date(yy, mm - 1, dd); calView(cur, { a, b: addDays(a, 1), label: `${mm}月${dd}日` }); };
  const { data } = await evq(rng.a, rng.b);
  const ls = $("#ls");
  ls.innerHTML = (data && data.length) ? data.map((e, i) => { const d = new Date(e.starts_at);
    return `<button class="ev sub" data-i="${i}"><b>${d.getMonth() + 1}/${d.getDate()} ${hm(e.starts_at)}</b> ${esc(e.title)}<br><small>${esc(who(e))}</small></button>`; }).join("") : "予定はありません。";
  ls.onclick = e => { const b = e.target.closest("button"); if (b) eventForm(data[b.dataset.i]); };
}

function eventForm(ev, ds) {
  const d = ev ? new Date(ev.starts_at) : null;
  const date = d ? ymd(d) : ds, time = d ? `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : "10:00";
  const opts = `<option value="">みんな</option>` + Object.values(members).map(u => `<option value="${esc(u.user_id)}">${esc(u.display_name)}</option>`).join("");
  set(`<div class="row"><button class="sub" id="bk">${ic("back")} もどる</button><h2>${ev ? "予定をなおす" : "予定を入れる"}</h2></div>
    <div class="card"><label>予定の内容</label><input id="ti" placeholder="例:病院、誕生日会">
    <label>日にち</label><input id="dt" type="date"><label>時間</label><input id="hv" type="time">
    <label>だれの予定</label><select id="wh">${opts}</select><p class="err" id="err"></p></div>
    <div class="big"><button id="sv">保存する</button>${ev ? `<button class="sub" id="rm">${ic("trash")} 予定をけす</button>` : ""}</div>`);
  $("#ti").value = ev ? ev.title : ""; $("#dt").value = date; $("#hv").value = time; $("#wh").value = ev && ev.for_member || "";
  $("#bk").onclick = () => calView(d || new Date(date + "T00:00"));
  $("#sv").onclick = async () => {
    const title = $("#ti").value.trim(), dv = $("#dt").value, tv = $("#hv").value;
    if (!title || !dv || !tv) return $("#err").textContent = "内容・日にち・時間を入れてください";
    const at = new Date(`${dv}T${tv}`);
    const row = { title, starts_at: at.toISOString(), for_member: $("#wh").value || null };
    const r = ev ? await sb.from("events").update(row).eq("id", ev.id) : await sb.from("events").insert({ ...row, family_id: fam.id, created_by: me.id });
    r.error ? $("#err").textContent = "保存できませんでした。もう一度お試しください。" : calView(at);
  };
  if (ev) $("#rm").onclick = async () => { if (await ask("この予定をけしますか?", "けす")) { await sb.from("events").delete().eq("id", ev.id); calView(d); } };
}

function settingsView() {
  let icon = fam.my.icon;
  set(`<div class="row"><button class="sub" id="bk">${ic("back")} もどる</button><h2>設定</h2></div>
    <div class="card"><label>お名前</label><input id="nm" autocomplete="off">
    <label>アイコン</label><div id="cur" style="font-size:3.2rem"></div><div class="icg" id="ics"></div>
    <input id="fi" type="file" accept="image/*" class="hide">
    <div class="big" style="margin-top:12px"><button class="sub" id="up">${ic("camera")} 写真をえらぶ</button></div></div>
    <p class="err" id="err"></p><div class="big"><button id="sv">保存する</button></div>`);
  $("#nm").value = fam.my.display_name;
  $("#sv").parentElement.insertAdjacentHTML("beforebegin", `<div class="card"><label>文字の大きさ</label><div class="tabs" id="fs"></div></div>`);
  const fd = () => { $("#fs").innerHTML = Object.keys(FS).map(k => `<button data-k="${k}" class="sub ${FS[k] === curFs ? "on" : ""}">${k}</button>`).join(""); };
  fd();
  $("#fs").onclick = e => { const b = e.target.closest("button"); if (!b) return; curFs = FS[b.dataset.k];
    document.documentElement.style.fontSize = curFs + "px"; try { localStorage.setItem("fs", curFs); } catch (x) {} fd(); };
  const draw = () => {
    $("#cur").innerHTML = av(icon);
    $("#ics").innerHTML = ICONS.map(k => `<button data-k="${k}" class="${k === icon ? "on" : ""}" aria-label="アイコンをえらぶ">${ic(k)}</button>`).join("");
  };
  draw();
  $("#ics").onclick = e => { const b = e.target.closest("button"); if (b) { icon = b.dataset.k; draw(); } };
  $("#bk").onclick = start;
  $("#up").onclick = () => $("#fi").click();
  $("#fi").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const blob = await shrink(f, 256), path = `${fam.id}/avatar-${me.id}-${Date.now()}.jpg`;
      const u = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
      if (u.error) throw u.error;
      avUrl[path] = URL.createObjectURL(blob); icon = "photo:" + path; $("#err").textContent = ""; draw();
    } catch (x) { $("#err").textContent = "写真をのせられませんでした。"; }
  };
  $("#sv").onclick = async () => {
    const name = $("#nm").value.trim();
    if (!name) return $("#err").textContent = "お名前を入れてください";
    const { error } = await sb.from("members").update({ display_name: name, icon }).eq("family_id", fam.id).eq("user_id", me.id);
    if (error) return $("#err").textContent = "保存できませんでした。もう一度お試しください。";
    const old = fam.my.icon;
    if (old && old.startsWith("photo:") && old !== icon) sb.storage.from("photos").remove([old.slice(6)]);
    start();
  };
}

let liveCh = null, liveFam = null, onLive = null;
function killLive() { if (liveCh) sb.removeChannel(liveCh); liveCh = null; liveFam = null; }
async function loadMembers() {
  const { data: ms } = await sb.from("members").select("user_id, display_name, icon").eq("family_id", fam.id);
  members = Object.fromEntries((ms || []).map(m => [m.user_id, m]));
  fam.my = members[me.id] || fam.my;
  const ph = [...new Set(Object.values(members).map(m => m.icon).filter(i => i && i.startsWith("photo:")).map(i => i.slice(6)))];
  avUrl = {};
  if (ph.length) { const { data: u } = await sb.storage.from("photos").createSignedUrls(ph, 3600); (u || []).forEach(x => avUrl[x.path] = x.signedUrl); }
}
function startLive() {
  if (liveCh && liveFam === fam.id) return;
  killLive(); liveFam = fam.id;
  liveCh = sb.channel("live-" + fam.id);
  ["messages", "photos", "photo_comments", "events", "members"].forEach(t =>
    liveCh.on("postgres_changes", { event: "*", schema: "public", table: t, filter: "family_id=eq." + fam.id },
      async p => { if (t === "members") await loadMembers(); if (onLive) onLive(t, p); }));
  liveCh.subscribe();
}
async function paintLast() {
  const { data } = await sb.from("messages").select("*").eq("family_id", fam.id).order("created_at", { ascending: false }).limit(1);
  const m = data && data[0], el = $("#last");
  if (el) el.innerHTML = m ? `<b>${esc((members[m.user_id] || {}).display_name)}</b>:${esc(m.body || "写真を送りました")}` : "まだメッセージはありません。最初の一言を送ってみましょう。";
}
async function paintToday() {
  const t = new Date(), a = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const { data } = await evq(a, addDays(a, 1)), el = $("#today");
  if (el) el.innerHTML = (data && data.length) ? data.map(e => `<div><b>${hm(e.starts_at)}</b> ${esc(e.title)} <small>(${esc(who(e))})</small></div>`).join("") : "今日の予定はありません。";
}
function ask(msg, ok = "はい") {
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "ov"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");
    o.innerHTML = `<div class="card"><h2>${esc(msg)}</h2><div class="big" style="margin-top:16px"><button class="sub" id="no">もどる</button><button class="danger" id="yes">${esc(ok)}</button></div></div>`;
    document.body.appendChild(o);
    const done = v => { o.remove(); res(v); };
    o.querySelector("#yes").onclick = () => done(true); o.querySelector("#no").onclick = () => done(false);
    o.querySelector("#no").focus();
  });
}

const sig = {};
const signed = p => sig[p] || (sig[p] = sb.storage.from("photos").createSignedUrl(p, 3600).then(r => r.data ? r.data.signedUrl : ""));
async function saveToPhone(url, name = "photo.jpg") {
  try {
    const blob = await (await fetch(url)).blob(), file = new File([blob], name, { type: blob.type || "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alert("保存できませんでした。写真を長く押して保存してください。"); }
}
function viewImage(path, url) {
  const o = document.createElement("div"); o.className = "ov"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");
  o.innerHTML = `<div class="card"><img src="${esc(url)}" alt="送られた写真"><p class="err" id="vm" role="status"></p>
    <div class="big"><button id="al">${ic("plus")} アルバムに保存</button><button class="sub" id="ph2">${ic("download")} スマホに保存</button><button class="sub" id="cl2">とじる</button></div></div>`;
  document.body.appendChild(o);
  const q = x => o.querySelector(x);
  q("#cl2").onclick = () => o.remove(); q("#cl2").focus();
  q("#ph2").onclick = () => saveToPhone(url);
  q("#al").onclick = async () => {
    q("#al").disabled = true; q("#vm").textContent = "保存しています…";
    const np = `${fam.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const c = await sb.storage.from("photos").copy(path, np);
    const r = c.error ? c : await sb.from("photos").insert({ family_id: fam.id, user_id: me.id, path: np });
    q("#vm").textContent = r.error ? "保存できませんでした。" : "アルバムに保存しました。";
    q("#al").disabled = false;
  };
}

start();
</script>
